# TrueNAS 25.10.4: Apps > Discover Apps > Install via YAML.
# Replace every REPLACE_ value using the release notes and your actual dataset.
# Do not deploy this template unchanged. No server or media mounts are needed.
name: jellyfin-community
services:
  gateway:
    image: ghcr.io/infish/jellyfin-community-web:v0.1.0-alpha.7@sha256:REPLACE_WEB_DIGEST
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JELLYFIN_UPSTREAM: http://REPLACE_JELLYFIN_HOST:8096
    # Deliberately independent of community health/startup.
  community:
    image: ghcr.io/infish/jellyfin-community-backend:v0.1.0-alpha.7@sha256:REPLACE_BACKEND_DIGEST
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/community.sqlite
      JELLYFIN_URL: http://REPLACE_JELLYFIN_HOST:8096
      PRESENCE_ENABLED: "true"
      BOARD_ENABLED: "true"
      REQUESTS_ENABLED: "false" # Seerr automation stays disabled.
      REQUEST_BOARD_ENABLED: "true"
      LIVE_COMPAT_VERIFIED: "false"
      MOCK_UPSTREAMS: "false"
    volumes:
      - /mnt/REPLACE_POOL/apps/jellyfin-community:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3096/api/community/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
