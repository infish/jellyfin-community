name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
      - name: Backend checks
        working-directory: backend
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev
      - name: Prepare exact web source
        run: sh scripts/prepare-web.sh
      - name: Web checks
        working-directory: upstream/jellyfin-web
        run: |
          npm ci
          npm run build:check
          npm test -- src/scripts/community/online.test.ts src/scripts/community/holdAdvance.test.ts src/scripts/community/emojiPicker.test.ts
          npm run build:production
      - name: Validate local deployment configuration
        run: docker compose config --quiet
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare exact web source
        run: sh scripts/prepare-web.sh
      - name: Export complete web source
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/web.Dockerfile
          target: source
          outputs: type=local,dest=release
          cache-to: type=gha,mode=max
          cache-from: type=gha
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.11.0
      - name: Archive backend dependencies and deployment source
        run: |
          npm ci --omit=dev --prefix backend
          tar -czf release/backend-dependency-source.tar.gz -C backend node_modules package.json package-lock.json LICENSE
          git archive --format=tar.gz HEAD > release/jellyfin-community-source.tar.gz
          sha256sum release/*.tar.gz > release/SHA256SUMS
      - name: Publish matching source before distributing images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --prerelease
          gh release upload "$RELEASE_TAG" release/*.tar.gz release/SHA256SUMS
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish web gateway
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ghcr.io/infish/jellyfin-community-web:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
      - name: Publish backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          push: true
          tags: ghcr.io/infish/jellyfin-community-backend:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable deployment images
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "ghcr.io/infish/jellyfin-community-web:$RELEASE_TAG@$WEB_DIGEST" "ghcr.io/infish/jellyfin-community-backend:$RELEASE_TAG@$BACKEND_DIGEST" > release/IMAGES.txt
          gh release upload "$RELEASE_TAG" release/IMAGES.txt
